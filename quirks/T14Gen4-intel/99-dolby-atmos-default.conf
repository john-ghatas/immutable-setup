context.modules = [
    {
        name = libpipewire-module-filter-chain
        args = {
            node.name = "dolby_atmos_laptop"
            node.description = "Dolby Atmos EQ"
            media.name = "Dolby Atmos EQ"

            filter.graph = {
                nodes = [
                    {
                        type = builtin
                        name = bass
                        label = bq_peaking
                        control = {
                            Freq = 120
                            Gain = -3.5
                            Q = 1.2
                        }
                    }

                    {
                        type = builtin
                        name = warmth
                        label = bq_lowshelf
                        control = {
                            Freq = 280
                            Gain = 5.0
                            Q = 0.7
                        }
                    }

                    {
                        type = builtin
                        name = clarity
                        label = bq_peaking
                        control = {
                            Freq = 1800
                            Gain = 2.5
                            Q = 1.5
                        }
                    }

                    {
                        type = builtin
                        name = air
                        label = bq_highshelf
                        control = {
                            Freq = 6500
                            Gain = -2.0
                            Q = 0.7
                        }
                    }

                    {
                        type = builtin
                        name = volume
                        label = linear
                        control = {
                            Mult = 1.5
                        }
                    }
                ]

                links = [
                    { output = "bass:Out" input = "warmth:In" }
                    { output = "warmth:Out" input = "clarity:In" }
                    { output = "clarity:Out" input = "air:In" }
                    { output = "air:Out" input = "volume:In" }
                ]

                inputs = [
                    "bass:In"
                ]

                outputs = [
                    "volume:Out"
                ]
            }

            capture.props = {
                node.name = "dolby_input"
                media.class = "Audio/Sink"
                audio.position = [ FL FR ]
            }

            playback.props = {
                node.name = "dolby_output"
                audio.position = [ FL FR ]
            }
        }
    }
]
