[development]
image=docker.io/johngh/distrobox-images:development-base
pull=true
start_now=true
additional_packages=net-tools htop nmap openssl pipx netcat lm_sensors glib2-devel sassc jq ansible-lint pnpm
init_hooks=bash $HOME/.local/bin/distrobox-init.sh
exported_bins=/usr/bin/jq /usr/bin/nmap /usr/bin/nc /usr/bin/tig /usr/bin/ansible /usr/bin/ansible-playbook /usr/bin/ansible-galaxy /usr/bin/terraform /usr/bin/packer /usr/bin/iperf3 /usr/bin/pnpm
exported_apps=codium

[general]
image=docker.io/johngh/distrobox-images:general-base
pull=true
start_now=true
additional_packages=net-tools htop nmap openssl pipx netcat lm_sensors jq glib2-devel sassc ansible-lint
init_hooks=bash $HOME/.local/bin/distrobox-init.sh
exported_apps=thunderbird

[r]
image=docker.io/johngh/distrobox-images:rstudio-base
pull=true
start_now=true
additional_packages=net-tools htop nmap openssl pipx netcat lm_sensors jq glib2-devel sassc ansible-lint
init_hooks=bash $HOME/.local/bin/distrobox-init.sh
exported_apps=rstudio

[ubuntu]
image=docker.io/johngh/distrobox-images:ubuntu-base
pull=true
start_now=true
additional_packages=software-properties-common apt-transport-https git nvtop vim neovim pipx netcat-openbsd default-jdk htop openssl lm-sensors
init_hooks=bash $HOME/.local/bin/distrobox-init.sh
exported_apps=intellij-idea
